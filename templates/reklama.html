{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рекламные карточки</title>
  <style>
    body {
      margin: 0;
      background: black;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* растягивает видео на весь экран */
      transition: opacity 1s ease; /* плавный переход */
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
    .visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <video id="v1" autoplay muted playsinline class="visible"></video>
  <video id="v2" autoplay muted playsinline class="hidden"></video>

  <script>
    const videos = [
      "{% static 'videos/burger.mp4' %}",
      "{% static 'videos/pizza.mp4' %}",
      "{% static 'videos/стрипсы.mp4' %}",
      "{% static 'videos/shawerma.mp4' %}"
    ];

    let current = document.getElementById("v1");
    let next = document.getElementById("v2");

    function getRandomVideo() {
      return videos[Math.floor(Math.random() * videos.length)];
    }

    function swap() {
      // выбираем случайный ролик
      next.src = getRandomVideo();
      next.load();
      next.play();

      // плавный переход
      next.classList.remove("hidden");
      next.classList.add("visible");
      current.classList.remove("visible");
      current.classList.add("hidden");

      // меняем местами
      [current, next] = [next, current];
    }

    // стартуем первый ролик
    current.src = getRandomVideo();
    current.play();

    // переключаем по окончании
    current.addEventListener("ended", swap);
    next.addEventListener("ended", swap);
  </script>
</body>
</html>
